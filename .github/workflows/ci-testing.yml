# Phase 9 Testing Infrastructure - Per-Package and Integration Testing
# Created by 09-05-PLAN: CI Matrix for per-package and integration testing
#
# Features:
# - Per-package isolated tests (TEST-06): Each package tested in isolated venv
# - Preset integration tests (TEST-07): Validates agent composition presets
# - Provenance export tests: Validates multi-agent workflow export
# - Python 3.12 only
# - fail-fast: false to identify ALL failures, not just first
#
# Test isolation ensures:
# - Missing dependency declarations are caught
# - Package boundaries are properly enforced
# - Integration issues are pinpointed to exact package/preset

name: Testing Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'lobster/**'
      - 'packages/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci-testing.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lobster/**'
      - 'packages/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci-testing.yml'

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTEST_ADDOPTS: "--color=yes --tb=short"

jobs:
  # ==========================================================================
  # TEST-06: Per-Package Isolated Tests
  # Each package tested in its own venv to catch missing dependency declarations
  # ==========================================================================
  package-tests:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false  # Continue all tests to identify ALL failures
      matrix:
        package:
          - lobster-transcriptomics
          - lobster-proteomics
          - lobster-genomics
          - lobster-visualization
          - lobster-ml
          - lobster-research
          - lobster-metadata
          - lobster-structural-viz
          - lobster-drug-discovery
          - lobster-metabolomics
          - lobster-vector

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -h

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Create isolated venv
        run: uv venv --python 3.12 .venv

      - name: Install core and package under test
        id: install
        run: |
          PACKAGE_DIR="packages/${{ matrix.package }}"
          test -f "$PACKAGE_DIR/pyproject.toml"
          uv pip install -e ".[dev]" -e "$PACKAGE_DIR"

      - name: Validate vector-only API then install legacy compatibility fixture
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.package == 'lobster-vector' }}
        run: |
          # The modern vector API must work without metadata. The legacy
          # lobster.services.vector compatibility shim is owned by metadata.
          .venv/bin/python -m pytest packages/lobster-vector/tests/test_contracts.py::TestCanonicalImport \
            packages/lobster-vector/tests/test_contracts.py::TestSubpackageExports \
            --import-mode=importlib --no-cov -v --junit-xml=results-vector-only.xml
          .venv/bin/python scripts/check_test_results.py --require-no-skips results-vector-only.xml
          uv pip install -e packages/lobster-metadata

      - name: Run package tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          PACKAGE_TEST_DIR="packages/${{ matrix.package }}/tests"
          test -d "$PACKAGE_TEST_DIR"
          .venv/bin/python -m pytest "$PACKAGE_TEST_DIR" \
            -m "not slow and not real_api" \
            --import-mode=importlib -v --no-cov \
            --junit-xml=results-${{ matrix.package }}.xml --tb=short
          .venv/bin/python scripts/check_test_results.py results-${{ matrix.package }}.xml

      - name: Run package contracts in separate processes
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          mapfile -t CONTRACTS < <(find "packages/${{ matrix.package }}/tests" -type f \
            \( -name 'test_aquadif_*.py' -o -name '*contract*.py' \) | sort)
          test "${#CONTRACTS[@]}" -gt 0
          for index in "${!CONTRACTS[@]}"; do
            RESULT="results-contract-${{ matrix.package }}-$index.xml"
            .venv/bin/python -m pytest "${CONTRACTS[$index]}" \
              -m "not slow and not real_api" --import-mode=importlib \
              -v --no-cov --junit-xml="$RESULT" --tb=short
            .venv/bin/python scripts/check_test_results.py --require-no-skips "$RESULT"
          done

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results-${{ matrix.package }}
          path: results-*.xml
          retention-days: 14

  # ==========================================================================
  # TEST-07: Preset Integration Tests
  # Validates that agent composition presets work correctly
  # ==========================================================================
  preset-tests:
    name: Test preset ${{ matrix.preset }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Collect integration evidence even when a package test fails.
    if: ${{ !cancelled() }}
    needs: [package-tests]
    strategy:
      fail-fast: false
      matrix:
        preset:
          - scrna-basic
          - scrna-full
          - multiomics-full

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -h

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Install all local packages
        run: |
          uv venv --python 3.12 .venv
          INSTALL_ARGS=(-e ".[dev,full]")
          for PACKAGE_DIR in packages/*; do
            test -f "$PACKAGE_DIR/pyproject.toml" || continue
            INSTALL_ARGS+=(-e "$PACKAGE_DIR")
          done
          uv pip install "${INSTALL_ARGS[@]}"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify preset dependency resolution
        run: |
          python -c "
          from lobster.config.agent_presets import expand_preset, is_valid_preset

          preset_name = '${{ matrix.preset }}'

          # Verify preset is valid
          assert is_valid_preset(preset_name), f'Preset {preset_name} is not valid'

          # Expand preset and verify agents
          agents = expand_preset(preset_name)
          assert agents is not None, f'Preset {preset_name} expansion returned None'
          assert len(agents) > 0, f'Preset {preset_name} has no agents'

          print(f'Preset {preset_name} resolved to {len(agents)} agents:')
          for agent in agents:
              print(f'  - {agent}')
          "

      - name: Run preset integration tests
        run: |
          # Convert preset name to test file name (replace - with _)
          TEST_FILE="tests/integration/test_preset_$(echo '${{ matrix.preset }}' | tr '-' '_').py"
          if [ -f "$TEST_FILE" ]; then
            echo "Running tests from $TEST_FILE"
            pytest "$TEST_FILE" \
              -m "not slow and not real_api" \
              --import-mode=importlib \
              -v \
              --no-cov \
              --junit-xml=results-preset-${{ matrix.preset }}.xml \
              --tb=short
          else
            echo "Test file $TEST_FILE not found"
            exit 1
          fi
          python scripts/check_test_results.py results-preset-${{ matrix.preset }}.xml

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results-preset-${{ matrix.preset }}
          path: results-preset-${{ matrix.preset }}.xml
          retention-days: 14

  # ==========================================================================
  # Integration Tests: Provenance Export
  # Validates multi-agent workflow provenance and notebook export
  # ==========================================================================
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !cancelled() }}
    needs: [package-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -h

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Install all local packages
        id: install
        run: |
          uv venv --python 3.12 .venv
          INSTALL_ARGS=(-e ".[dev,full]")
          for PACKAGE_DIR in packages/*; do
            test -f "$PACKAGE_DIR/pyproject.toml" || continue
            INSTALL_ARGS+=(-e "$PACKAGE_DIR")
          done
          uv pip install "${INSTALL_ARGS[@]}"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run root contract tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          mapfile -t CONTRACTS < <(python scripts/discover_contract_tests.py tests)
          test "${#CONTRACTS[@]}" -gt 0
          for index in "${!CONTRACTS[@]}"; do
            RESULT="results-root-contract-$index.xml"
            python -m pytest "${CONTRACTS[$index]}" \
              -m "contract and not slow and not real_api" --import-mode=importlib \
              -v --no-cov --junit-xml="$RESULT" --tb=short
            python scripts/check_test_results.py --require-no-skips "$RESULT"
          done

      # Routing-surface regression gate. Routing quality is description
      # quality: a capability absent from its owner's routing surface is unreachable,
      # and one already claimed by a competing agent gets mis-routed there. This fails
      # when unreachable capabilities increase, in total or for any single agent --
      # a fix in one agent must not mask a regression in another.
      #
      # Requires the agent packages, hence this job rather than Basic CI.
      - name: Routing-surface regression gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python scripts/audit_routing_surface.py --check

      # Blocking: installed analysis paths must execute successfully.
      - name: Verify analysis environment
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python scripts/verify_env.py -v

      - name: Run provenance export tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          TEST_FILE="tests/integration/test_provenance_export.py"
          if [ -f "$TEST_FILE" ]; then
            pytest "$TEST_FILE" \
              -m "not slow and not real_api" \
              --import-mode=importlib \
              -v \
              --no-cov \
              --junit-xml=results-integration.xml \
              --tb=short
          else
            echo "Provenance export tests not found at $TEST_FILE"
            exit 1
          fi
          python scripts/check_test_results.py results-integration.xml

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results-integration
          path: results-*.xml
          retention-days: 14

  # ==========================================================================
  # Summary Job: Aggregate Results for Branch Protection
  # ==========================================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [package-tests, preset-tests, integration-tests]
    if: always()

    steps:
      - name: Download all test results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: test-results
          pattern: test-results-*

      - name: Display test summary
        run: |
          echo "=== Test Results Summary ==="
          echo ""

          TOTAL_PASS=0
          TOTAL_FAIL=0

          for dir in test-results/*/; do
            if [ -d "$dir" ]; then
              for file in "$dir"results-*.xml; do
                if [ -f "$file" ]; then
                  name=$(basename "$file" .xml | sed 's/results-//')

                  # Count failures and errors from JUnit XML
                  failures=$(grep -oP 'failures="\K[0-9]+' "$file" 2>/dev/null | head -1 || echo "0")
                  errors=$(grep -oP 'errors="\K[0-9]+' "$file" 2>/dev/null | head -1 || echo "0")

                  # Handle empty values
                  failures=${failures:-0}
                  errors=${errors:-0}

                  if [ "$failures" = "0" ] && [ "$errors" = "0" ]; then
                    echo "PASS: $name"
                    TOTAL_PASS=$((TOTAL_PASS + 1))
                  else
                    echo "FAIL: $name (failures: $failures, errors: $errors)"
                    TOTAL_FAIL=$((TOTAL_FAIL + 1))
                  fi
                fi
              done
            fi
          done

          echo ""
          echo "=== Summary ==="
          echo "Passed: $TOTAL_PASS"
          echo "Failed: $TOTAL_FAIL"

      # Require success rather than testing for "failure". None of the three jobs
      # above is conditional, so anything other than success — skipped, cancelled,
      # or an empty result — means this run did not prove what this check claims,
      # and testing for "failure" exits 0 on every one of those. preset-tests and
      # integration-tests both `needs: [package-tests]`, so they report "skipped"
      # whenever package-tests does not succeed: the old predicate passed a
      # cancelled run outright and reported "All test jobs completed successfully!".
      - name: Check job results
        run: |
          PACKAGE_RESULT="${{ needs.package-tests.result }}"
          PRESET_RESULT="${{ needs.preset-tests.result }}"
          INTEGRATION_RESULT="${{ needs.integration-tests.result }}"

          echo "Package tests: $PACKAGE_RESULT"
          echo "Preset tests: $PRESET_RESULT"
          echo "Integration tests: $INTEGRATION_RESULT"

          if [ "$PACKAGE_RESULT" != "success" ] || [ "$PRESET_RESULT" != "success" ] || [ "$INTEGRATION_RESULT" != "success" ]; then
            echo ""
            echo "One or more test jobs did not succeed. See individual job logs for details."
            exit 1
          fi

          echo ""
          echo "All test jobs completed successfully!"
