# Called only after the production package suite has passed exact installation
# and registry-hash verification. Never triggered directly by a test/stable tag.
name: Create GitHub Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tui-test-run-id:
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Enforce production tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python scripts/verify_release_artifacts.py source "$VERSION"
          [[ "$GITHUB_REPOSITORY" == the-omics-os/lobster ]] || exit 1
          [[ "$GITHUB_REF" == "refs/tags/v$VERSION" ]] || exit 1
      - name: Download published core artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-lobster-ai
          path: dist/
      - name: Download verified TUI binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tui-binary-*
          path: binaries/
          run-id: ${{ inputs.tui-test-run-id }}
          github-token: ${{ github.token }}
      - name: Download corresponding TUI wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tui-wheel-*
          path: tui-wheels/
          merge-multiple: true
          run-id: ${{ inputs.tui-test-run-id }}
          github-token: ${{ github.token }}
      - name: Verify assets against production registry
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python scripts/verify_release_artifacts.py registry "$VERSION" lobster-ai dist --index pypi
          python scripts/verify_release_artifacts.py registry "$VERSION" lobster-ai-tui tui-wheels --index pypi
          python - <<'PY'
          import os
          import shutil
          import sys
          import zipfile
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from verify_release_artifacts import expected_files, platforms, require
          version = os.environ['VERSION']
          require({p.name for p in Path('binaries').iterdir()} ==
                  {f'tui-binary-{p}' for p in platforms()}, 'Unexpected binary inventory')
          output = Path('release-assets')
          output.mkdir()
          for filename, platform in expected_files(version, 'lobster-ai-tui').items():
              binary = Path(f'binaries/tui-binary-{platform}/lobster-tui')
              with zipfile.ZipFile(Path('tui-wheels') / filename) as wheel:
                  require(binary.read_bytes() == wheel.read('lobster_ai_tui/bin/lobster-tui'),
                          f'Raw binary/wheel mismatch: {platform}')
              shutil.copyfile(binary, output / f'lobster-tui-{version}-{platform}')
          for artifact in Path('dist').iterdir():
              shutil.copyfile(artifact, output / artifact.name)
          PY
          (cd release-assets && sha256sum ./* > "checksums-tui-${VERSION}.txt")
      - name: Create release with verified artifacts
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['VERSION']
          notes = f'## Installation\n\n```bash\nuv pip install "lobster-ai[full]=={version}"\n```\n\n'
          notes += 'The package suite passed exact-version installation on Linux and registry checksum verification.\n\n'
          notes += f'[PyPI](https://pypi.org/project/lobster-ai/{version}/) · [Documentation](https://docs.omics-os.com)\n'
          Path('release-notes.md').write_text(notes)
          PY
          gh release create "v$VERSION" --verify-tag --title "Lobster AI v$VERSION" \
            --notes-file release-notes.md release-assets/*
