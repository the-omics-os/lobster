          packages-dir: dist/
          skip-existing: true
          verbose: true

  # --- Experimental Agent Packages (PyPI + TestPyPI) ---
  # Experimental labeling is unchanged. A complete release requires all intended
  # distributions to publish and pass exact-version installation verification.

  publish-lobster-metadata:
    name: Publish lobster-metadata (experimental)
    needs: [validate-version, build, publish-lobster-ai]
