    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-lobster-drug-discovery
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ needs.validate-version.outputs.is_test == 'true' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          packages-dir: dist/
          skip-existing: true
          verbose: true

  # ===========================================================================
  # Step 4: Verify Exact Installation and Published Bytes (both registries)
  # ===========================================================================
  verify-installation:
    name: Verify Installation
    needs:
      - validate-version
      - publish-lobster-ai
      - publish-lobster-transcriptomics
      - publish-lobster-research
      - publish-lobster-visualization
      - publish-lobster-vector
      - publish-lobster-proteomics
      - publish-lobster-genomics
      - publish-lobster-metabolomics
      - publish-lobster-metadata
      - publish-lobster-ml
      - publish-lobster-structural-viz
      - publish-lobster-drug-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download the actual published artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: artifacts/

      - name: Wait for packages to be indexed
        run: sleep 60

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3-dev

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Verify registry hashes and install exact first-party wheels
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
          INDEX: ${{ needs.validate-version.outputs.is_test == 'true' && 'testpypi' || 'pypi' }}
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          set -euo pipefail
          for directory in artifacts/dist-*; do
            package="${directory#artifacts/dist-}"
            python scripts/verify_release_artifacts.py registry "$VERSION" "$package" "$directory" --index "$INDEX"
          done
          python scripts/verify_release_artifacts.py requirements "$VERSION" --index "$INDEX" --output release-requirements.txt
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r release-requirements.txt
          uv pip check --python .venv/bin/python
          ROOT="$PWD"
          cd "$(mktemp -d)"
          "$ROOT/.venv/bin/python" "$ROOT/scripts/verify_release_artifacts.py" installed "$VERSION"
          "$ROOT/.venv/bin/lobster" --help

      - name: Verify Go TUI binary discovery and execution
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          ROOT="$PWD"
          cd "$(mktemp -d)"
          "$ROOT/.venv/bin/python" - <<'PY'
          import os
          import subprocess
          from lobster_ai_tui import get_binary_path
          from lobster.cli_internal.go_tui_launcher import find_tui_binary_fast
          binary = get_binary_path()
          assert binary.is_file() and os.access(binary, os.X_OK)
          assert find_tui_binary_fast() == str(binary)
          output = subprocess.check_output([str(binary), 'version'], text=True)
          print(output)
          assert os.environ['VERSION'] in output.split(), output
          PY

      - name: Verify agent discovery from installed distributions
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          ROOT="$PWD"
          cd "$(mktemp -d)"
          "$ROOT/.venv/bin/python" - <<'PY'
          from importlib.metadata import entry_points
          from lobster.core.component_registry import component_registry
          expected = {ep.name for ep in entry_points(group='lobster.agents')}
          actual = set(component_registry.list_agents())
          print(f'Expected agents: {sorted(expected)}')
          print(f'Discovered agents: {sorted(actual)}')
          assert expected and expected <= actual, expected - actual
          PY

      - name: Retain exact registry installation pins
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-requirements-${{ github.run_attempt }}
          path: release-requirements.txt
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # Step 5: Release Summary
  # ===========================================================================
  github-release:
    name: Create verified GitHub release
    needs: [validate-version, verify-installation]
    if: needs.validate-version.outputs.is_test == 'false'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/public-release.yml
    with:
      version: ${{ needs.validate-version.outputs.version }}
      tui-test-run-id: ${{ needs.validate-version.outputs.tui_test_run_id }}

  summary:
    name: Release Summary
    needs:
      - validate-version
      - build
      - publish-lobster-ai
      - publish-lobster-transcriptomics
      - publish-lobster-research
      - publish-lobster-visualization
      - publish-lobster-vector
      - publish-lobster-proteomics
      - publish-lobster-genomics
      - publish-lobster-metabolomics
      - publish-lobster-metadata
      - publish-lobster-ml
      - publish-lobster-structural-viz
      - publish-lobster-drug-discovery
      - wait-for-tui
      - verify-installation
      - github-release
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate truthful release summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          VERSION: ${{ needs.validate-version.outputs.version }}
          IS_TEST: ${{ needs.validate-version.outputs.is_test }}
        run: |
          python - <<'PY'
          import json
          import os
          needs = json.loads(os.environ['NEEDS_JSON'])
          test = os.environ['IS_TEST'] == 'true'
          failed = []
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              target = 'TestPyPI' if test else 'PyPI'
              summary.write(f"## {target} release {os.environ['VERSION']}\n\n")
              summary.write('| Job | Result |\n|---|---|\n')
              for job, outcome in needs.items():
                  result = outcome['result']
                  summary.write(f'| {job} | {result} |\n')
                  expected = 'skipped' if test and job == 'github-release' else 'success'
                  if result != expected:
                      failed.append(job)
              summary.write('\nExperimental labels remain unchanged; all intended artifacts must verify.\n')
          if failed:
              raise SystemExit(f'Release incomplete: {failed}')
          PY

  # ===========================================================================
  # Step 6: (removed) Trigger Omics-OS Cloud Deployment
  # ===========================================================================
  #
  # A `trigger-cloud-deploy` job used to live here. On every `v*.*.*` tag it
  # sent a `repository_dispatch` of type `lobster-packages-published` to
  # the-omics-os/lobster-cloud, which ran a production ECS deploy with no engine
  # pin — so publishing this package redeployed the Cloud backend from whatever
  # this repository's `main` happened to be at that minute, with no human in the
  # loop. That is the mechanism behind the 2026-08-17 pandas-3 production outage.
  # It was not merely theoretical: the consumer succeeded 17 times, most recently
  # 2026-03-26 and 2026-03-27, both after the Cloud Dockerfile had switched to an
  # unpinned `@main` install. The payload's `is_test` was read and never used to
  # skip, so a `-test` tag deployed production too.
  #
  # The consumer trigger was removed in lobster-cloud (be81078b, 2026-08-17), so
  # the event now lands with nothing listening. This job is removed as well
  # because an inert dispatch is a loaded one: the next person to add any
  # `repository_dispatch` listener over there re-arms it without knowing it
  # exists.
  #
  # Cloud deploys are a deliberate act from a workstation: `cli deploy core-api`,
  # which injects the tracked engine pin (lobster-cloud engine-pin.txt) and fails
  # closed if it is missing. Do not restore automatic cross-repo deployment.
  #
  # `secrets.LOBSTER_CLOUD_DEPLOY_TOKEN` is now unused by this workflow. It is a
  # cross-repo credential carrying production-deploy intent; it is flagged for a
  # decision rather than rotated here.
